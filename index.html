<script>
const T=THREE,$=id=>document.getElementById(id),rnd=Math.random;
const CH={sprocket:{n:'Sprocket',col:0x9aa3ad,spd:7,jmp:11,atk:'water'},flame:{n:'Flame',col:0xe8281e,spd:7.5,jmp:10.5,atk:'fire'},bull:{n:'Bull',col:0xa8101a,spd:8,jmp:10,atk:'wind'}};
const WORLDS=[{n:'Gear Meadow',sky:0x7ec8ff,pl:0x5cb85c,boss:3},{n:'Magma Foundry',sky:0x3a1410,pl:0x7a6a64,lava:1,boss:5},{n:'Storm Sky Tower',sky:0x2b3558,pl:0x8c9cc8,boss:8}];
const cv=$('c'),ren=new T.WebGLRenderer({canvas:cv,antialias:false});ren.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new T.Scene(),cam=new T.PerspectiveCamera(60,1,.1,300);
scene.add(new T.HemisphereLight(0xffffff,0x556677,.95));const sun=new T.DirectionalLight(0xffffff,.7);sun.position.set(5,10,3);scene.add(sun);
function rs(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
const mat=c=>new T.MeshLambertMaterial({color:c});
function bx(w,h,d,c,x=0,y=0,z=0,g){const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);g&&g.add(m);return m}
function robot(k){const g=new T.Group(),C=k=='evil'?0xc4001a:CH[k].col;
 bx(.8,.9,.5,C,0,.75,0,g);bx(.7,.6,.6,C,0,1.5,0,g);bx(.5,.18,.1,k=='evil'?0xffee00:0x33ddff,0,1.55,.31,g);
 bx(.25,.6,.25,C,-.55,.75,0,g);bx(.25,.6,.25,C,.55,.75,0,g);bx(.28,.5,.3,0x333333,-.2,.25,0,g);bx(.28,.5,.3,0x333333,.2,.25,0,g);
 if(k=='sprocket'){const o=new T.Mesh(new T.CylinderGeometry(.35,.35,.12,8),mat(0x555d66));o.rotation.x=Math.PI/2;o.position.set(0,.9,-.3);g.add(o);bx(.06,.3,.06,0x4aa8ff,0,1.95,0,g)}
 if(k=='flame'){const f=new T.Mesh(new T.ConeGeometry(.3,.7,6),mat(0xffa51e));f.position.y=2.1;g.add(f)}
 if(k=='bull'||k=='evil')for(const s of[-1,1]){const h=new T.Mesh(new T.ConeGeometry(.12,.5,5),mat(k=='bull'?0xf2f2f2:0x111111));h.position.set(s*.3,1.95,0);h.rotation.z=-s*.5;g.add(h)}
 return g}
let W,PF=[],E=[],I=[],Co=[],Pr=[],PL=[],grp,goal,gp,bossDead=0,won=0,t=0,camYaw=0,running=false,sc='sprocket',sw=0,mode='solo',rem,pc,dc,role,mt;
const seed=s=>()=>(s=(s*16807)%2147483647)/2147483647;
const at=e=>e.m.position.set(e.pl.x+e.ox,e.pl.y+e.oy,e.pl.z+e.oz);
function msg(s,ms){const m=$('msg');m.textContent=s;clearTimeout(mt);mt=setTimeout(()=>m.textContent='',ms)}
function build(wi){
 if(grp)scene.remove(grp);grp=new T.Group();scene.add(grp);W=WORLDS[wi];scene.background=new T.Color(W.sky);scene.fog=new T.Fog(W.sky,40,130);
 PF=[];E=[];I=[];Co=[];Pr=[];const r=seed(wi*97+13);
 const add=(x,y,z,hw,hd,o={})=>{const p=Object.assign({bx:x,by:y,bz:z,x,y,z,hw,hd,dx:0,dy:0,dz:0,ax:0,ay:0,az:0,sp:1,ph:0},o);p.m=bx(hw*2,1,hd*2,o.col||W.pl,0,0,0,grp);p.m.position.set(x,y-.5,z);PF.push(p);return p};
 if(W.lava){const l=new T.Mesh(new T.PlaneGeometry(600,600),new T.MeshBasicMaterial({color:0xff4a10}));l.rotation.x=-Math.PI/2;l.position.y=-3;grp.add(l)}
 let z=0,y=0,last=add(0,0,0,6,6,{col:0x4488ff});const n=14+wi*4;
 for(let i=1;i<=n;i++){
  const hw=2+r()*2,hd=2+r()*2;z-=last.hd+hd+2.5+r()*2.5;y=Math.max(0,Math.min(8,y+(r()-.45)*1.6));
  const p=add((r()-.5)*10,y,z,hw,hd);
  if(i%4==0)Object.assign(p,{ax:6,sp:1+r(),ph:r()*6});else if(i%5==0)Object.assign(p,{ay:2,sp:.8});else if(wi>0&&i%3==0)Object.assign(p,{az:4,sp:1.2});
  for(let c=0;c<3;c++){const m=new T.Mesh(new T.TorusGeometry(.3,.1,6,12),mat(0xffd21e));grp.add(m);Co.push({m,pl:p,ox:(c-1)*1.2,oy:1.2,oz:0})}
  if(i%3==1){const k=['gear','star','boots'][(rnd()*3)|0],m=new T.Mesh(new T.OctahedronGeometry(.5),mat({gear:0x44ff88,star:0xffee33,boots:0xff44cc}[k]));grp.add(m);I.push({m,pl:p,ox:p.hw*.5,oy:1.4,oz:0,k})}
  if(i%2==0)enemy(p,0);last=p}
 z-=last.hd+16;const ar=add(0,y,z,14,14,{col:0x883333});enemy(ar,1);
 goal=new T.Group();bx(.2,5,.2,0xffffff,0,2.5,0,goal);bx(1.5,1,.1,0xffd21e,.8,4.4,0,goal);goal.position.set(0,y,z-10);goal.visible=false;grp.add(goal);gp={x:0,y,z:z-10}}
function enemy(p,boss){const m=boss?robot('evil'):new T.Group();if(!boss){bx(1,1,1,0x6a3d9a,0,.5,0,m);bx(.7,.2,.1,0xffffff,0,.6,.51,m)}else m.scale.setScalar(2);grp.add(m);E.push({m,pl:p,ox:0,oy:0,oz:0,hp:boss?W.boss:1,boss,cd:2,fz:0,s:0,ic:0,ph:rnd()*6})}
function mk(c,x,rm){const m=robot(c);grp.add(m);return{c,m,x,y:0,z:0,vx:0,vy:0,vz:0,ry:Math.PI,hp:3,inv:0,star:0,boots:0,cd:0,coins:0,g:null,coy:0,jb:0,jh:0,safe:{x,y:0,z:0},remote:rm,tx:x,ty:0,tz:0}}
function start(wi,fn){sw=wi;won=0;build(wi);PL=[];rem=null;bossDead=0;const ks=Object.keys(CH);
 PL.push(mk(sc,0));if(mode=='local')PL.push(mk(ks[(ks.indexOf(sc)+1)%3],2.5));
 if(!fn&&mode=='online')net({t:'w',w:wi});
 $('menu').style.display='none';running=true;msg(W.n,2000)}
// ---- input
const K={},TS={x:0,y:0,j:0,a:0};
addEventListener('keydown',e=>{K[e.code]=1;if(running&&/^(Space|Arrow)/.test(e.code))e.preventDefault()});addEventListener('keyup',e=>K[e.code]=0);
function inp(i){return i==0?{x:(K.KeyD?1:0)-(K.KeyA?1:0)+TS.x,y:(K.KeyW?1:0)-(K.KeyS?1:0)+TS.y,j:K.Space||TS.j,a:K.KeyF||K.KeyJ||TS.a}:{x:(K.ArrowRight?1:0)-(K.ArrowLeft?1:0),y:(K.ArrowUp?1:0)-(K.ArrowDown?1:0),j:K.Enter,a:K.ShiftRight}}
if(matchMedia('(pointer:coarse)').matches)$('ui').style.display='block';
const js=$('js'),kn=$('kn');let jd=0;
function jm(e){const r=js.getBoundingClientRect(),dx=e.clientX-r.left-60,dy=e.clientY-r.top-60,d=Math.min(Math.hypot(dx,dy),50),a=Math.atan2(dy,dx),px=Math.cos(a)*d,py=Math.sin(a)*d;TS.x=px/50;TS.y=-py/50;kn.style.transform=`translate(${px}px,${py}px)`}
js.onpointerdown=e=>{jd=1;js.setPointerCapture(e.pointerId);jm(e)};js.onpointermove=e=>jd&&jm(e);js.onpointerup=js.onpointercancel=()=>{jd=0;TS.x=TS.y=0;kn.style.transform=''};
for(const[id,k]of[['bj','j'],['ba','a']]){const b=$(id);b.onpointerdown=()=>TS[k]=1;b.onpointerup=b.onpointercancel=b.onpointerleave=()=>TS[k]=0}
let dr=null;cv.onpointerdown=e=>dr=e.clientX;cv.onpointermove=e=>{if(dr!=null){camYaw-=(e.clientX-dr)*.006;dr=e.clientX}};cv.onpointerup=cv.onpointerleave=()=>dr=null;
// ---- combat
function hurt(p){if(p.inv>0||p.star>0)return;p.hp--;p.inv=1.5;p.vy=8;if(p.hp<=0)respawn(p)}
function respawn(p,f){if(f)p.hp--;if(p.hp<=0)p.hp=3;Object.assign(p,{x:p.safe.x,y:p.safe.y+.3,z:p.safe.z,vx:0,vy:0,vz:0,inv:1.5})}
function hurtE(e,d){if(d&&e.ic>0)return;e.hp-=d;if(d)e.ic=.4;if(e.hp<=0&&E.includes(e)){grp.remove(e.m);E.splice(E.indexOf(e),1);if(e.boss){bossDead=1;goal.visible=true;msg('Evil Sprocket is down! Reach the flag!',3000)}}}
function shoot(p){const a=CH[p.c].atk,d=new T.Vector3(Math.sin(p.ry),0,Math.cos(p.ry)),w=a=='wind';
 const m=new T.Mesh(w?new T.TorusGeometry(.6,.15,6,12):new T.SphereGeometry(.3,8,6),mat({water:0x44aaff,fire:0xff7a1a,wind:0xe8e8e8}[a]));if(w)m.rotation.x=Math.PI/2;
 m.position.set(p.x,p.y+1,p.z).addScaledVector(d,.8);grp.add(m);Pr.push({m,v:d.multiplyScalar(a=='fire'?14:w?9:12),life:w?1:1.8,a,team:'p',r:w?1.6:.5,hit:new Set()})}
function bolt(e){const n=PL[0],ep=e.m.position;if(Math.hypot(n.x-ep.x,n.z-ep.z)>30)return;const d=new T.Vector3(n.x-ep.x,n.y+.8-ep.y-2.5,n.z-ep.z).normalize(),m=new T.Mesh(new T.SphereGeometry(.4,8,6),mat(0xff0022));m.position.set(ep.x,ep.y+2.5,ep.z);grp.add(m);Pr.push({m,v:d.multiplyScalar(9),life:3,a:'bolt',team:'e',r:.4,hit:new Set()})}
const near=(p,m,r)=>Math.hypot(p.x-m.position.x,p.y+.8-m.position.y,p.z-m.position.z)<r;
// ---- physics: AABB platforms, moving-surface carry, coyote time, jump buffer
function step(p,i,dt){
 const k=inp(i);let mx=k.x,my=k.y;const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}
 const s=Math.sin(camYaw),c=Math.cos(camYaw),wx=mx*c-my*s,wz=-mx*s-my*c;
 if(p.g){p.x+=p.g.dx;p.y+=p.g.dy;p.z+=p.g.dz;p.coy=.12}else p.coy-=dt;
 const sp=CH[p.c].spd*(p.boots>0?1.3:1),a=Math.min(1,dt*(p.g?14:6));
 p.vx+=(wx*sp-p.vx)*a;p.vz+=(wz*sp-p.vz)*a;
 if(k.j&&!p.jh)p.jb=.12;p.jh=!!k.j;p.jb-=dt;
 if(p.jb>0&&p.coy>0){p.vy=CH[p.c].jmp*(p.boots>0?1.35:1);p.coy=0;p.jb=0;p.g=null}
 if(!k.j&&p.vy>4)p.vy-=60*dt;
 p.vy=Math.max(p.vy-28*dt,-26);
 const py=p.y;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.g=null;
 for(let it=0;it<2;it++)for(const q of PF){
  const ox=Math.min(p.x+.4,q.x+q.hw)-Math.max(p.x-.4,q.x-q.hw),oz=Math.min(p.z+.4,q.z+q.hd)-Math.max(p.z-.4,q.z-q.hd);
  if(ox<=0||oz<=0)continue;const top=q.y,bot=q.y-1;
  if(p.y>=top||p.y+1.6<=bot)continue;
  if(py>=top-.4-Math.abs(q.dy)&&p.vy<=.1){p.y=top;p.vy=0;p.g=q}
  else if(p.vy>0&&p.y+1.6<=bot+.6){p.vy=0;p.y=bot-1.6}
  else if(ox<oz){p.x+=p.x<q.x?-ox:ox;p.vx=0}else{p.z+=p.z<q.z?-oz:oz;p.vz=0}}
 if(p.g&&!(p.g.ax||p.g.ay||p.g.az))p.safe={x:p.x,y:p.y,z:p.z};
 if(p.y<(W.lava?-3.5:-14))respawn(p,1);
 if(Math.hypot(p.vx,p.vz)>.5)p.ry=Math.atan2(p.vx,p.vz);
 p.inv-=dt;p.star-=dt;p.boots-=dt;p.cd-=dt;
 if(k.a&&p.cd<=0){p.cd=.45;shoot(p);net({t:'a'})}
 for(const e of E.slice()){const ep=e.m.position,h=e.boss?3.6:1;
  if(Math.hypot(p.x-ep.x,p.z-ep.z)<(e.boss?1.8:1.1)&&p.y<ep.y+h&&p.y+1.6>ep.y){
   if(p.star>0)hurtE(e,3);else if(p.vy<0&&p.y>ep.y+h*.6){hurtE(e,1);p.vy=12}else if(e.fz<=0)hurt(p)}}
 for(const c of Co.slice())if(near(p,c.m,1)){grp.remove(c.m);Co.splice(Co.indexOf(c),1);p.coins++}
 for(const o of I.slice())if(near(p,o.m,1.2)){grp.remove(o.m);I.splice(I.indexOf(o),1);if(o.k=='gear'){p.hp=Math.min(5,p.hp+1);msg('Gear! +1 health',1200)}else if(o.k=='star'){p.star=8;msg('Star power!',1200)}else{p.boots=12;msg('Spring boots!',1200)}}
 if(bossDead&&Math.hypot(p.x-gp.x,p.z-gp.z)<2.5&&Math.abs(p.y-gp.y)<4)next()}
function next(){if(won)return;won=1;const n=sw+1;msg(n<3?'World clear!':'🏆 You beat Evil Sprocket!',2500);setTimeout(()=>{if(n<3)start(n);else{running=false;$('menu').style.display='flex'}},2600)}
let nt=0,ht=0;
function update(dt){
 t+=dt;camYaw+=((K.KeyQ?1:0)-(K.KeyE?1:0))*dt*2;
 for(const p of PF){const o=[p.x,p.y,p.z],s=Math.sin(t*p.sp+p.ph);p.x=p.bx+p.ax*s;p.y=p.by+p.ay*s;p.z=p.bz+p.az*s;p.dx=p.x-o[0];p.dy=p.y-o[1];p.dz=p.z-o[2];p.m.position.set(p.x,p.y-.5,p.z)}
 PL.forEach((p,i)=>{if(p.remote){p.x+=(p.tx-p.x)*.35;p.y+=(p.ty-p.y)*.35;p.z+=(p.tz-p.z)*.35}else step(p,i,dt);
  p.m.position.set(p.x,p.y,p.z);p.m.rotation.y=p.ry;p.m.visible=p.inv>0?((t*20|0)%2==0):true;p.m.scale.setScalar(p.star>0?1+.1*Math.sin(t*20):1)});
 Co.forEach(c=>{at(c);c.m.rotation.y=t*3});I.forEach(o=>{at(o);o.m.rotation.y=t*2;o.m.position.y+=Math.sin(t*3)*.15});
 const loc=PL.filter(p=>!p.remote);
 for(const e of E.slice()){if(e.fz>0)e.fz-=dt;else e.s+=dt;e.ic-=dt;const q=e.pl;
  e.ox=Math.sin(e.s*(e.boss?.7:1.2)+e.ph)*(e.boss?q.hw-3:q.hw-1.2);if(e.boss)e.oz=Math.cos(e.s*.5)*(q.hd-3);
  at(e);const ep=e.m.position;
  if(e.boss&&loc[0])e.m.rotation.y=Math.atan2(loc[0].x-ep.x,loc[0].z-ep.z);else e.m.rotation.y=Math.cos(e.s*1.2+e.ph)>0?Math.PI/2:-Math.PI/2;
  if(e.boss&&e.fz<=0&&(e.cd-=dt)<=0){e.cd=2.2;bolt(e)}
  e.m.traverse(o=>o.material&&o.material.emissive.setHex(e.fz>0?0x66ccff:0))}
 for(const b of Pr.slice()){b.life-=dt;const m=b.m,pp=m.position;pp.addScaledVector(b.v,dt);
  if(b.a=='fire'){b.v.y-=22*dt;for(const q of PF)if(Math.abs(pp.x-q.x)<q.hw&&Math.abs(pp.z-q.z)<q.hd&&pp.y<q.y+.3&&pp.y>q.y-1&&b.v.y<0){b.v.y=7;pp.y=q.y+.3}}
  if(b.a=='wind'){m.rotation.z+=dt*10;m.scale.setScalar(1+(1-b.life)*1.5)}
  if(b.team=='e'){for(const p of loc)if(near(p,m,1)){hurt(p);b.life=0}}
  else for(const e of E.slice()){const ep=e.m.position;
   if(Math.hypot(ep.x-pp.x,ep.z-pp.z)<(e.boss?1.6:.8)+b.r*.3&&pp.y>ep.y-.5&&pp.y<ep.y+(e.boss?4:1.5)){
    if(b.a=='wind'){if(b.hit.has(e))continue;b.hit.add(e);hurtE(e,1)}
    else{if(b.a=='water'){hurtE(e,e.fz>0?2:0);e.fz=3}else hurtE(e,1);b.life=0;break}}}
  if(b.life<=0){grp.remove(m);Pr.splice(Pr.indexOf(b),1)}}
 let cx=0,cy=0,cz=0,sp=0;loc.forEach(p=>{cx+=p.x;cy+=p.y;cz+=p.z});cx/=loc.length;cy/=loc.length;cz/=loc.length;
 if(loc.length>1)sp=Math.hypot(loc[0].x-loc[1].x,loc[0].z-loc[1].z);const d=9+sp*.6;
 cam.position.lerp(new T.Vector3(cx+Math.sin(camYaw)*d,cy+6+sp*.3,cz+Math.cos(camYaw)*d),.12);cam.lookAt(cx,cy+1,cz);
 if((nt-=dt)<=0&&loc[0]){nt=.07;const p=loc[0];net({t:'s',x:p.x,y:p.y,z:p.z,ry:p.ry,c:p.c})}
 if((ht-=dt)<=0){ht=.2;$('hud').innerHTML=PL.map((p,i)=>`<b>${p.remote?'NET':'P'+(i+1)}</b> ${CH[p.c].n} ${'❤'.repeat(Math.max(p.hp,0))} 🪙${p.coins}${p.star>0?' ⭐':''}${p.boots>0?' 👟':''}`).join('<br>')+`<br>${W.n} ${bossDead?'🚩':'👿'}`}}
// ---- online: WebRTC with copy/paste codes (no server; works on LAN or internet)
const net=o=>dc&&dc.readyState=='open'&&dc.send(JSON.stringify(o));
const pcs=()=>{pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pc.ondatachannel=e=>wire(e.channel)};
function wire(ch){dc=ch;ch.onopen=()=>$('ns').textContent='✅ Connected! Host can press START.';
 ch.onclose=()=>{$('ns').textContent='Disconnected';if(rem&&grp){grp.remove(rem.m);PL=PL.filter(p=>p!==rem);rem=null}};
 ch.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.t=='w'){mode='online';start(m.w,1)}
  else if(m.t=='s'&&running){if(!rem||rem.c!=m.c){if(rem){grp.remove(rem.m);PL=PL.filter(p=>p!==rem)}rem=mk(m.c,m.x,1);rem.y=m.y;rem.z=m.z;PL.push(rem)}Object.assign(rem,{tx:m.x,ty:m.y,tz:m.z,ry:m.ry})}
  else if(m.t=='a'&&rem)shoot(rem)}}
const gather=()=>new Promise(r=>{if(pc.iceGatheringState=='complete')return r();pc.onicegatheringstatechange=()=>pc.iceGatheringState=='complete'&&r();setTimeout(r,3500)}).then(()=>btoa(JSON.stringify(pc.localDescription)));
$('hb').onclick=async()=>{role='host';pcs();wire(pc.createDataChannel('g'));await pc.setLocalDescription(await pc.createOffer());$('nout').value=await gather();$('ns').textContent='Send your code to a friend, paste their reply above, press Connect'};
$('jb').onclick=()=>{role='join';pcs();$('ns').textContent='Paste the host code above, press Connect'};
$('nok').onclick=async()=>{try{await pc.setRemoteDescription(JSON.parse(atob($('nin').value.trim())));if(role=='join'){await pc.setLocalDescription(await pc.createAnswer());$('nout').value=await gather();$('ns').textContent='Send this reply code to the host'}}catch(e){$('ns').textContent='That code did not work. Check you pasted all of it.'}};
// ---- menu
function group(id,items,cb,sel){const el=$(id);items.forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{[...el.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');cb(v)};el.appendChild(b);if(v===sel)b.classList.add('sel')})}
group('chars',[['sprocket','🤖 Sprocket: water & ice'],['flame','🔥 Flame: fire'],['bull','🐂 Bull: wind']],v=>sc=v,'sprocket');
group('worlds',WORLDS.map((w,i)=>[i,w.n]),v=>sw=v,0);
group('modes',[['solo','Solo'],['local','Local 2P'],['online','Online']],v=>{mode=v;$('net').style.display=v=='online'?'block':'none'},'solo');
$('go').onclick=()=>{if(mode=='online'){if(!(dc&&dc.readyState=='open'))return $('ns').textContent='Connect a friend first';if(role=='join')return $('ns').textContent='The host starts the game'}start(sw)};
build(0);cam.position.set(0,8,14);cam.lookAt(0,0,-10);
let last=0;(function loop(ts){requestAnimationFrame(loop);const dt=Math.min((ts-last)/1000,.033)||0;last=ts;if(running)update(dt);ren.render(scene,cam)})(0);
</script></body></html>
